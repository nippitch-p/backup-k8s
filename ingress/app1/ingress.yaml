apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-ingress
  namespace: lab
spec:
  ingressClassName: nginx
  rules:
  - host: app1.ipa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: svc-app1, port: { number: 8080 } }
