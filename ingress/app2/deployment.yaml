apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:0.2.3
        args: ["-listen=:8080","-text=Hello from APP2"]
        ports:
        - containerPort: 8080
