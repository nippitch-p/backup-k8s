apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2-ingress
  namespace: lab
spec:
  ingressClassName: nginx
  rules:
  - host: app2.ipa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: svc-app2, port: { number: 8080 } }
