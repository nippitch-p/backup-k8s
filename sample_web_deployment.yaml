apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: pchxnph/sample_app:v1.0
        ports:
        - containerPort: 8080
